[package]
name = "lantai"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
pulldown-cmark = "0.13.4"
rmsd_yaml = "0.1.1"
serde = { version = "1.0.229", features = ["derive"] }
slint = "1.18.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
unicode-width = "0.2.2"

[build-dependencies]
slint-build = "1.18.1"
